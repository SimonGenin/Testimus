<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test run</title>
<style>
:root {
  --canvas: #f7f7f8; --surface: #ffffff; --sunken: #f1f1f3; --border: #ececee; --field: #d9d9de;
  --text: #18181b; --muted: #52525b; --subtle: #71717a; --accent: #3e63dd; --on-accent: #ffffff;
  --success: #16774a; --success-bg: #e9f7ef; --success-edge: #3e9a69;
  --danger: #c42b2b; --danger-bg: #fdeeee; --danger-edge: #e0716d;
  --warning: #8f5300; --warning-bg: #fdf4e2; --neutral: #52525b; --neutral-bg: #f1f1f3;
  --radius: 8px; --font: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", Consolas, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #0e0e10; --surface: #151517; --sunken: #1d1d21; --border: #26262b; --field: #3a3a42;
    --text: #ededf0; --muted: #a8a8b2; --subtle: #8b8b95; --accent: #8da4ff; --on-accent: #0e0e10;
    --success: #5fd08f; --success-bg: #122a1d; --success-edge: #2f7a51;
    --danger: #ff8f87; --danger-bg: #33181a; --danger-edge: #a8453f;
    --warning: #f0b44c; --warning-bg: #2d2210; --neutral: #a8a8b2; --neutral-bg: #24242a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); color: var(--text); font: 14px/22px var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
header h1 { flex: 1 1 20rem; margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; line-height: 18px; }
.mono { font-family: var(--mono); }
.layout { display: flex; min-height: calc(100vh - 70px); }
nav { flex: none; width: 300px; padding: 12px; border-right: 1px solid var(--border); background: var(--surface); }
nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
nav button { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 12px; border: 0; border-radius: var(--radius); background: transparent; text-align: left; cursor: pointer; }
nav button:hover { background: var(--sunken); }
nav button[aria-current="true"] { background: var(--sunken); box-shadow: inset 0 0 0 1px var(--accent); }
main { flex: 1; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; }
h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
tr.nok td { background: var(--danger-bg); }
td img { display: block; max-width: 320px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--border); }
.cell { white-space: pre-wrap; overflow-wrap: anywhere; }
.btn { height: 28px; padding: 0 10px; border: 1px solid var(--field); border-radius: var(--radius); background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn:focus-visible, nav button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[aria-pressed="true"].ok { background: var(--success-bg); border-color: var(--success-edge); color: var(--success); }
.btn[aria-pressed="true"].nok { background: var(--danger-bg); border-color: var(--danger-edge); color: var(--danger); }
.btn[aria-pressed="true"].status { background: var(--sunken); border-color: var(--accent); }
.marks { display: flex; gap: 6px; }
input[type="text"], textarea { width: 100%; padding: 4px 8px; border: 1px solid var(--field); border-radius: var(--radius); background: var(--surface); }
textarea { min-height: 56px; resize: vertical; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.passed { color: var(--success); background: var(--success-bg); }
.problem { color: var(--danger); background: var(--danger-bg); }
.blocked { color: var(--warning); background: var(--warning-bg); }
.not-run { color: var(--neutral); background: var(--neutral-bg); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.grow { flex: 1; }
.card { padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.banner { padding: 8px 12px; border-radius: var(--radius); background: var(--warning-bg); color: var(--warning); }
@media (max-width: 760px) { .layout { flex-direction: column; } nav { width: auto; border-right: 0; border-bottom: 1px solid var(--border); } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Test run</h1>
  <span id="saved" class="small muted" role="status"></span>
  <button type="button" id="download" class="btn">Save run.json</button>
  <label class="small muted">Tester <input type="text" id="tester" style="width: 12rem" placeholder="Your name"></label>
  <span id="version" class="small muted"></span>
</header>
<div id="notice"></div>
<div class="layout">
  <nav aria-label="Tests"><ol id="tests"></ol></nav>
  <main id="test" aria-label="Test"></main>
</div>
<script type="application/json" id="run-data">{"run":null,"results":{}}</script>
<script src="run.js"></script>
</body>
</html>
